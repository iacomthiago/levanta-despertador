name: Compilar e testar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar o APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # A chave fixa garante que cada versão nova instale por cima da anterior
      # sem apagar os dados. Ela fica só nos segredos do repositório.
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/levanta.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/levanta.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem chave de assinatura nos segredos; usando chave temporária."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PciVersionCode=${{ github.run_number }}

      - name: Separar o instalador
        run: cp app/build/outputs/apk/release/app-release.apk levanta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: levanta-apk
          path: levanta.apk

  smoke:
    name: Testar no emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: levanta-apk

      - name: Liberar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar o alarme de ponta a ponta
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: python3 ci/smoke.py levanta.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-emulador
          path: ci-out

  release:
    name: Publicar o instalador
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: levanta-apk

      - name: Criar a versão com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" levanta.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Disciplina 1.0.${{ github.run_number }}" \
            --notes "Instalador para Android. Baixe o arquivo levanta.apk no tablet e toque nele para instalar. Passo a passo no README." \
            --latest
